<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening & Job Matching</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8f5ff);
        }

        .header {
            background: linear-gradient(135deg, #6c3df5, #4267e8);
            color: white;
            padding: 35px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 10px;
            opacity: 0.9;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(80, 60, 150, 0.12);
        }

        .card h2 {
            color: #4d35a8;
            margin-top: 0;
        }

        .upload {
            border: 2px dashed #8b6cf6;
            padding: 35px;
            text-align: center;
            border-radius: 14px;
            background: #faf9ff;
        }

        input[type="file"] {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 190px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            resize: none;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .button-area {
            text-align: center;
            margin: 30px 0;
        }

        button {
            background: linear-gradient(135deg, #7046e8, #456ee8);
            color: white;
            border: none;
            padding: 15px 45px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.03);
        }

        .result {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(80, 60, 150, 0.12);
        }

        .score {
            font-size: 55px;
            font-weight: bold;
            color: #6246d9;
            margin: 15px;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #16803c;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
        }

        .skills {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            text-align: left;
        }

        .matched h3 {
            color: #159447;
        }

        .missing h3 {
            color: #dc3545;
        }

        ul {
            line-height: 2;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .skills {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>📄 Resume Screening & Job Matching</h1>
    <p>Find the right candidate for the right job</p>
</div>

<div class="container">

    <!-- FORM -->
    <form action="/check" method="POST" enctype="multipart/form-data">

        <div class="cards">

            <!-- Resume Upload -->
            <div class="card">
                <h2>📄 Upload Resume</h2>

                <div class="upload">
                    <p>Select your resume PDF</p>

                    <input
                        type="file"
                        name="resume"
                        accept=".pdf"
                        required
                    >
                </div>
            </div>

            <!-- Job Description -->
            <div class="card">
                <h2>💼 Job Description</h2>

                <textarea
                    name="job_description"
                    placeholder="Enter the job description here..."
                    required
                ></textarea>
            </div>

        </div>

        <!-- Button -->
        <div class="button-area">
            <button type="submit">
                🔍 CHECK MATCH
            </button>
        </div>

    </form>

    <!-- RESULT -->
    <div class="result">

        <h2>Match Result</h2>

        <div class="score">73%</div>

        <div class="status">
            SHORTLISTED ✅
        </div>

        <div class="skills">

            <div class="matched">
                <h3>🟢 Matched Skills</h3>

                <ul>
                    <li>Python</li>
                    <li>Flask</li>
                    <li>SQL</li>
                    <li>Git</li>
                </ul>
            </div>

            <div class="missing">
                <h3>🔴 Missing Skills</h3>

                <ul>
                    <li>Docker</li>
                    <li>AWS</li>
                </ul>
            </div>

        </div>

    </div>

</div>

</body>
</html>
